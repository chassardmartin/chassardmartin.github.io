# Maps a co-author's last name (lowercase) to their first-name variants and a
# link, so citations on the publications page render their name as a hyperlink.
"pellegrini":
  - firstname: ["Yves-Patrick", "Y.-P.", "Y. P."]
    url: https://www.researchgate.net/profile/Yves-Patrick-Pellegrini

"josien":
  - firstname: ["Marc", "M."]
    url: https://sites.google.com/view/marc-josien/
